/* --------------------------- Helpers ------------------------------ */
function setState(patch) {
  Object.assign(App.state, patch);
  render();
}
function go(s) { setState({ screen: s, domainsOpen: false, menuOpen: false }); }
function showToast(m) {
  setState({ toast: m });
  clearTimeout(App._tt);
  App._tt = setTimeout(function () { setState({ toast: '' }); }, 1800);
}
function toArabicNum(n) {
  return App.state.lang === 'ar'
    ? ('' + n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; })
    : ('' + n);
}
function softMix(c, p) { return 'color-mix(in srgb, ' + c + ' ' + p + '%, #FFF)'; }
function esc(s) { return ('' + s).replace(/"/g, '&quot;'); }

/* The Lamha logo mark (colors driven by CSS vars) */
function logo(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 96 96" fill="none">'
    + '<rect width="96" height="96" rx="26" fill="var(--pr,#0F7A5A)"></rect>'
    + '<rect x="20" y="26" width="56" height="11" rx="5.5" fill="#FFFFFF"></rect>'
    + '<rect x="34" y="43" width="42" height="11" rx="5.5" fill="var(--ac,#FFB020)"></rect>'
    + '<rect x="52" y="60" width="24" height="11" rx="5.5" fill="var(--mint,#2FD08A)"></rect>'
    + '<circle cx="28" cy="65.5" r="8" fill="var(--ink,#FF4757)"></circle></svg>';
}

/* ---------------------- Computed view model ----------------------- */
function computeVals() {
  var st = App.state;
  var lang = st.lang;
  var t = T[lang];
  var s = st.screen;
  var dom = st.domain;
  var pal = PALETTES.find(function (p) { return p.id === st.palette; }) || PALETTES[0];
  var dark = st.darkMode;
  var dcol = { all:pal.pr, banks:pal.pr, telecom:pal.mint, shop:pal.ac, delivery:pal.pr2, health:pal.ink, travel:pal.mint };
  var visible = NOTIFS.filter(function (n) { return n.domains.indexOf(dom) !== -1; });
  var activeDomain = DOMAINS.find(function (d) { return d.key === dom; }) || DOMAINS[0];
  var unreadIds = ['bank', 'deposit', 'offer'];
  var prioF = function (a) { return st.priorityOnly ? a.filter(function (n) { return n.bK; }) : a; };
  var shown = prioF(visible);
  var listBase = prioF(visible.filter(function (n) {
    return st.listFilter === 'all' || unreadIds.indexOf(n.id) !== -1;
  }));
  var badge = function (k) {
    return k === 'urgent' ? (lang === 'ar' ? 'عاجل' : 'Urgent')
      : k === 'worth' ? (lang === 'ar' ? 'يستحق انتباهك' : 'Worth a look') : '';
  };
  var mapN = function (n) {
    var key = n.domains[1] || 'all';
    var c = dcol[key] || pal.pr;
    var urgent = n.bK === 'urgent', worth = n.bK === 'worth';
    return {
      id: n.id,
      initial: n[lang === 'ar' ? 'iAr' : 'iEn'],
      avBg: urgent ? pal.ink : worth ? pal.ac : softMix(c, 16),
      avColor: urgent ? '#FFF' : worth ? '#231708' : c,
      title: n[lang === 'ar' ? 'titleAr' : 'titleEn'],
      sub: n[lang === 'ar' ? 'subAr' : 'subEn'],

    };
  };

  // calendar
  var active = 9, dotDay = 18, lead = 1;
  var calDays = [];
  for (var i = 0; i < 35; i++) {
    var num = i - lead + 1;
    if (num < 1 || num > 30) {
      calDays.push({ num: '', bg: 'transparent', color: 'transparent', weight: '400', dot: false });
    } else {
      calDays.push({
        num: toArabicNum(num),
        bg: num === active ? pal.pr : 'transparent',
        color: num === active ? '#FFF' : (dark ? '#EAF3EE' : '#10221B'),
        weight: num === active ? '700' : '400',
        dot: num === dotDay
      });
    }
  }

  var connectedCount = Object.keys(st.connected).filter(function (k) { return st.connected[k]; }).length;

  return {
    t: t,

  var wd = v.weekdays.map(function (w) { return '<span style="font-size:10px;color:var(--sub,#8A968F);">' + w + '</span>'; }).join('');
  var days = v.calDays.map(function (d) {
    var dot = d.dot ? '<span style="position:absolute;bottom:2px;inset-inline-start:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--ac,#FFB020);"></span>' : '';
    return '<span style="font-size:12px;padding:6px 0;position:relative;background:' + d.bg + ';color:' + d.color + ';border-radius:9px;font-weight:' + d.weight + ';">' + d.num + dot + '</span>';
  }).join('');
  return '<div style="position:absolute; inset:0; display:flex; flex-direction:column; animation:lm-fade .3s ease;">'
    + '<div style="padding:0 18px 12px; display:flex; align-items:center; justify-content:space-between; flex-shrink:0;"><button data-act="goList" style="width:34px;height:34px;border-radius:11px;background:var(--surf,#FFF);border:1px solid var(--line,#E4DCCB);display:flex;align-items:center;justify-content:center;cursor:pointer;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--txt,#10221B)" stroke-width="2" style="transform:scaleX(' + v.arrowFlip + ');"><path d="m9 18 6-6-6-6"></path></svg></button><span style="font-family:\'Readex Pro\'; font-weight:700; font-size:16px; color:var(--head,#073A2A);">' + t.jumpTitle + '</span><div style="width:34px;"></div></div>'
    + '<div class="lm-scroll" style="flex:1; overflow-y:auto; padding:0 18px 16px; display:flex; flex-direction:column; gap:14px;">'
    + '<div style="background:var(--surf,#FFF); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:12px;">'
    + '<div style="display:flex; align-items:center; justify-content:space-between;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pr,#0F7A5A)" stroke-width="2" style="transform:scaleX(' + v.arrowFlip + ');"><path d="m15 18-6-6 6-6"></path></svg><span style="font-family:\'Readex Pro\'; font-weight:600; font-size:15px; color:var(--head,#073A2A);">' + t.month + '</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--pr,#0F7A5A)" stroke-width="2" style="transform:scaleX(' + v.arrowFlip + ');"><path d="m9 18 6-6-6-6"></path></svg></div>'
    + '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center;">' + wd + days + '</div>'
    + '</div>'
    + '<span style="font-size:13px; font-weight:600; color:var(--head,#073A2A);">' + t.quickJumps + '</span>'
    + '<div style="display:flex; gap:8px; flex-wrap:wrap;">'
    + '<button data-act="goList" style="background:var(--pr,#0F7A5A);color:#FFF;font-size:12px;font-weight:600;padding:8px 15px;border-radius:12px;border:none;cursor:pointer;font-family:\'IBM Plex Sans Arabic\';">' + t.todayJ + '</button>'
    + '<button data-act="goList" style="background:var(--surf,#FFF);color:var(--sub,#4A5B52);font-size:12px;padding:8px 15px;border-radius:12px;border:1px solid var(--line,#E4DCCB);cursor:pointer;font-family:\'IBM Plex Sans Arabic\';">' + t.thisWeek + '</button>'
    + '<button data-act="goList" style="background:var(--surf,#FFF);color:var(--sub,#4A5B52);font-size:12px;padding:8px 15px;border-radius:12px;border:1px solid var(--line,#E4DCCB);cursor:pointer;font-family:\'IBM Plex Sans Arabic\';">' + t.thisMonth + '</button>'
    + '<button data-act="goList" style="background:var(--surf,#FFF);color:var(--sub,#4A5B52);font-size:12px;padding:8px 15px;border-radius:12px;border:1px solid var(--line,#E4DCCB);cursor:pointer;font-family:\'IBM Plex Sans Arabic\';">' + t.augustJ + '</button>'
    + '</div></div>'
    + '<div style="padding:12px 18px 16px; flex-shrink:0;"><button data-act="goList" style="width:100%;background:var(--pr,#0F7A5A); color:#FFF; border:none; height:48px; border-radius:15px; font-family:\'Readex Pro\'; font-weight:600; font-size:14px; cursor:pointer;">' + t.viewResults + '</button></div>'
    + '</div>';
}

function sideMenu(v) {
  var t = v.t;
  var item = function (act, svg, label, color) {
    return '<button data-act="' + act + '" style="text-align:start;background:none;border:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:14px;">' + svg + '<span style="font-size:14px; color:' + (color || '#FFFFFF') + '; opacity:' + (color ? '1' : '.85') + '; font-weight:' + (color ? '600' : '400') + ';">' + label + '</span></button>';
  };
  return '<div data-act="closeMenu" style="position:absolute; inset:0; background:rgba(11,23,18,.4); z-index:55; animation:lm-fade .2s ease;"></div>'
    + '<div style="position:absolute; top:0; bottom:0; inset-inline-end:0; width:270px; z-index:56; background:var(--dk,#073A2A); display:flex; flex-direction:column; animation:lm-slide .28s ease; box-shadow:0 0 46px -12px rgba(11,23,18,.5);">'
    + '<div style="padding:52px 20px 18px; display:flex; align-items:center; justify-content:space-between;"><div style="display:flex; align-items:center; gap:9px;">' + logo(25) + '<span style="font-family:\'Readex Pro\'; font-weight:700; font-size:18px; color:#FFF;">' + t.appName + '</span></div><button data-act="closeMenu" style="background:none;border:none;cursor:pointer;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".7"><path d="m6 6 12 12M18 6 6 18"></path></svg></button></div>'
    + '<div style="padding:0 16px 16px;"><div style="background:rgba(255,255,255,.08); border-radius:16px; padding:14px; display:flex; align-items:center; gap:12px;"><div style="width:44px;height:44px;border-radius:50%;background:var(--ac,#FFB020);"></div><div style="display:flex; flex-direction:column; gap:2px;"><span style="font-size:15px;font-weight:600;color:#FFF;">' + t.userName + '</span><span style="font-size:12px;color:#FFFFFF;opacity:.7;">roqaya@email.com</span></div></div></div>'
    + '<div style="flex:1; padding:0 10px; display:flex; flex-direction:column; gap:2px;">'
    + item('goHome', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"><path d="M3 10 12 3l9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>', t.home)
    + item('goList', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path></svg>', t.allNotifs)
    + item('goSearch', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>', t.search)
    + item('goCalendar', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M3 10h18M8 2v4M16 2v4"></path></svg>', t.jumpDate)
    + item('goSettings', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity=".85"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1l-.4-2.5h-4l-.4 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1z"></path></svg>', t.settingsShort)
    + item('toggleLang', '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--ac,#FFB020)" stroke-width="1.8"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20"></path></svg>', t.langSwitch, 'var(--ac,#FFB020)')
    + '</div>'
    + '<div style="padding:14px 26px 26px; border-top:1px solid rgba(255,255,255,.1); margin:0 10px;"><button data-act="goOnboarding" style="background:none;border:none;cursor:pointer;display:flex;align-items:center;gap:14px;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FF6B78" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg><span style="font-size:14px; color:#FF6B78; font-weight:600;">' + t.logout + '</span></button></div>'
    + '</div>';
}

function domainSheet(v) {
  var t = v.t;
  var cells = v.domains.map(function (d) {
    return '<button data-act="pickDomain" data-key="' + d.key + '" style="border:none; cursor:pointer; background:' + d.bg + '; border-radius:15px; padding:13px 6px; display:flex; flex-direction:column; align-items:center; gap:6px;">'
      + '<span style="color:' + d.iconColor + ';display:flex;">' + d.icon + '</span>'
      + '<span style="font-size:11px; color:' + d.labelColor + ';">' + d.label + '</span>'
      + '<span style="font-size:10px; color:' + d.countColor + '; font-weight:600;">' + d.count + '</span></button>';
  }).join('');
  return '<div data-act="closeDomains" style="position:absolute; inset:0; background:rgba(11,23,18,.32); z-index:40; animation:lm-fade .2s ease;"></div>'
    + '<div style="position:absolute; left:0; right:0; bottom:0; z-index:50; padding:0 12px 12px; animation:lm-sheet .28s cubic-bezier(.2,.8,.25,1);">'
    + '<div style="background:var(--surf,#FFF); border-radius:24px 24px 20px 20px; box-shadow:0 -18px 46px -12px rgba(11,23,18,.35); padding:16px; display:flex; flex-direction:column; gap:14px;">'
    + '<div style="width:38px; height:4px; background:#E1D8C8; border-radius:99px; align-self:center;"></div>'
    + '<div style="display:flex; align-items:center; justify-content:space-between;"><span style="font-family:\'Readex Pro\'; font-weight:600; font-size:15px; color:var(--head,#073A2A);">' + t.chooseDomain + '</span><span style="background:var(--line,#F1EBDE); color:var(--sub,#4A5B52); font-size:11px; padding:3px 10px; border-radius:999px;">' + t.domainsCount + '</span></div>'
    + '<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:9px;">' + cells + '</div>'
    + '<button data-act="closeDomains" style="background:var(--pr,#0F7A5A); color:#FFF; border:none; height:48px; border-radius:14px; font-family:\'Readex Pro\'; font-weight:600; font-size:15px; cursor:pointer;">' + t.applyDomain + '</button>'
    + '</div></div>';
}

function bottomNav(v) {
  var t = v.t;
  return '<div style="height:62px; background:var(--surf,#FFF); border-top:1px solid var(--line,#EDE6D9); display:flex; align-items:center; justify-content:space-around; flex-shrink:0; z-index:10;">'
    + '<button data-act="goHome" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-family:\'Readex Pro\';color:' + v.navHomeColor + ';"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10 12 3l9 7v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>' + t.home + '</span></button>'
    + '<button data-act="goList" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-family:\'Readex Pro\';color:' + v.navListColor + ';"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span>' + t.notifications + '</span></button>'
    + '<button data-act="goSearch" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-family:\'Readex Pro\';color:' + v.navSearchColor + ';"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><span>' + t.search + '</span></button>'
    + '<button data-act="goSettings" style="background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-family:\'Readex Pro\';color:' + v.navMoreColor + ';"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg><span>' + t.more + '</span></button>'
    + '</div>';
}

function paletteSwitcher(v) {
  var t = v.t;
  var chips = v.palettes.map(function (p) {
    return '<button data-act="pickPalette" data-id="' + p.id + '" title="' + esc(p.name) + '" style="cursor:pointer; background:var(--surf,#FFF); border:2px solid ' + p.ring + '; border-radius:13px; padding:6px 7px 7px; display:flex; flex-direction:column; align-items:center; gap:5px; min-width:78px;">'
      + '<span style="display:flex; border-radius:6px; overflow:hidden;">'
      + '<span style="width:15px; height:20px; background:' + p.c0 + ';"></span>'
      + '<span style="width:15px; height:20px; background:' + p.c1 + ';"></span>'
      + '<span style="width:15px; height:20px; background:' + p.c2 + ';"></span>'
      + '<span style="width:15px; height:20px; background:' + p.c3 + ';"></span>'
      + '<span style="width:15px; height:20px; background:' + p.c4 + ';"></span></span>'
      + '<span style="font-size:10px; font-weight:600; color:' + p.labelColor + ';">' + p.name + '</span></button>';
  }).join('');
  return '<div style="width:100%; max-width:760px; background:rgba(255,255,255,.6); border:1px solid #E4DCCB; border-radius:20px; padding:14px 16px; display:flex; flex-direction:column; gap:11px;">'
    + '<div style="display:flex; align-items:center; justify-content:space-between;"><span style="font-family:\'Readex Pro\'; font-weight:600; font-size:14px; color:' + v.cDk + ';">' + t.paletteTitle + '</span><span style="font-size:12px; color:' + v.cPr + '; font-weight:600;">' + v.activePaletteName + '</span></div>'
    + '<div style="display:flex; flex-wrap:wrap; gap:9px;">' + chips + '</div>'
    + '<span style="font-size:11px; color:#6A7A70;">' + t.paletteHint + '</span></div>';
}

/* Current visible screen inside the phone */
function activeScreen(v) {
  if (v.isOnboarding) return screenOnboarding(v);
  if (v.isAuth) return screenAuth(v);
  if (v.isPermission) return screenPermission(v);
  if (v.isConnect) return screenConnect(v);
  if (v.isLock) return screenLock(v);
  if (v.isHome) return screenHome(v);
  if (v.isSearch) return screenSearch(v);
  if (v.isDetails) return screenDetails(v);
  if (v.isThread) return screenThread(v);
  if (v.isSettings) return screenSettings(v);
  if (v.isList) return screenList(v);
  if (v.isCalendar) return screenCalendar(v);
  return '';
}

/* ------------------------------ Render ---------------------------- */
function render() {
  var v = computeVals();
  document.documentElement.setAttribute('dir', v.dir);
  document.documentElement.setAttribute('lang', v.lang === 'ar' ? 'ar' : 'en');

  var overlays = '';
  if (v.menuOpen) overlays += sideMenu(v);
  if (v.domainsOpen) overlays += domainSheet(v);
  if (v.toast) overlays += '<div style="position:absolute; bottom:78px; left:50%; transform:translateX(-50%); background:var(--dk,#073A2A); color:#FFF; font-family:\'Readex Pro\'; font-weight:600; font-size:13px; padding:11px 20px; border-radius:999px; z-index:70; box-shadow:0 12px 30px -10px rgba(11,23,18,.5); animation:lm-fade .2s ease; white-space:nowrap;">' + v.toast + '</div>';
  var nav = v.showNav ? bottomNav(v) : '';

  var html = ''
    + '<div dir="' + v.dir + '" style="font-family:\'Readex Pro\',\'IBM Plex Sans Arabic\',system-ui,sans-serif; color:var(--txt,#10221B); min-height:100vh; background:radial-gradient(circle at 50% 0,#EEE8DC,#E1DACC); display:flex; flex-direction:column; align-items:center; gap:18px; padding:34px 20px;">'
    + '<div style="display:flex; align-items:center; gap:10px;">'
    + '<svg width="28" height="28" viewBox="0 0 96 96" fill="none"><rect width="96" height="96" rx="26" fill="' + v.cPr + '"></rect><rect x="20" y="26" width="56" height="11" rx="5.5" fill="#FFFFFF"></rect><rect x="34" y="43" width="42" height="11" rx="5.5" fill="' + v.cAc + '"></rect><rect x="52" y="60" width="24" height="11" rx="5.5" fill="' + v.cMint + '"></rect><circle cx="28" cy="65.5" r="8" fill="' + v.cInk + '"></circle></svg>'
    + '<span style="font-family:\'Readex Pro\'; font-weight:700; font-size:19px; color:' + v.cDk + ';">' + v.t.previewTitle + '</span>'
    + '</div>'
    + paletteSwitcher(v)
    + '<div style="width:340px; height:700px; background:#0B1712; border-radius:46px; padding:11px; box-shadow:0 40px 90px -30px rgba(11,23,18,.6); position:relative;">'
    + '<div style="position:absolute; top:22px; left:50%; transform:translateX(-50%); width:110px; height:26px; background:#0B1712; border-radius:0 0 16px 16px; z-index:60;"></div>'
    + '<div class="lm-scroll" style="' + v.themeVars + ' width:100%; height:100%; background:var(--bg,#F4EEE2); border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column;">'
    + '<div style="height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; font-size:13px; font-weight:600; color:var(--txt,#10221B); flex-shrink:0; z-index:20;"><span>9:41</span><span style="letter-spacing:1px;">▪▪▪ ▪ ▮</span></div>'
    + '<div style="flex:1; position:relative; overflow:hidden;">' + activeScreen(v) + '</div>'
    + overlays
    + nav
    + '</div></div></div>';

  document.getElementById('app').innerHTML = html;
}

/* --------------------------- Actions ------------------------------ */
var ACTIONS = {
  toggleLang: function () { setState({ lang: App.state.lang === 'ar' ? 'en' : 'ar' }); },
  pickPalette: function (el) { setState({ palette: el.getAttribute('data-id') }); },
  goSignup: function () { setState({ screen: 'auth', authMode: 'signup', domainsOpen: false, menuOpen: false }); },
  goLogin: function () { setState({ screen: 'auth', authMode: 'login', domainsOpen: false, menuOpen: false }); },
  goOnboarding: function () { go('onboarding'); },
  setAuthLogin: function () { setState({ authMode: 'login' }); },
  setAuthSignup: function () { setState({ authMode: 'signup' }); },
  submitAuth: function () { go('permission'); },
  allowPerm: function () { go('connect'); },
  laterPerm: function () { go('connect'); },
  toggleSource: function (el) {
    var k = el.getAttribute('data-key');
    var c = Object.assign({}, App.state.connected);
    c[k] = !c[k];
    setState({ connected: c });
  },
  connectContinue: function () { go('lock'); },
  openApp: function () { go('home'); },
  openDetails: function () { setState({ screen: 'details', domainsOpen: false, menuOpen: false }); },
  openNotif: function () { setState({ screen: 'details', domainsOpen: false, menuOpen: false }); },
  goHome: function () { go('home'); },
  goSearch: function () { go('search'); },
  goSettings: function () { go('settings'); },
  goList: function () { go('list'); },
  goCalendar: function () { go('calendar'); },
  goThread: function () { setState({ screen: 'thread', domainsOpen: false, menuOpen: false, tab: 'thread' }); },
  openMenu: function () { setState({ menuOpen: true }); },
  closeMenu: function () { setState({ menuOpen: false }); },
  openDomains: function () { setState({ domainsOpen: true }); },
  closeDomains: function () { setState({ domainsOpen: false }); },
  setTabThread: function () { setState({ tab: 'thread' }); },
  setTabHistory: function () { setState({ tab: 'history' }); },
  togglePush: function () { setState({ push: !App.state.push }); },
  toggleSound: function () { setState({ sound: !App.state.sound }); },
  togglePriority: function () { setState({ priorityOnly: !App.state.priorityOnly }); },
  setLight: function () { setState({ darkMode: false }); },
  setDark: function () { setState({ darkMode: true }); },
  setListAll: function () { setState({ listFilter: 'all' }); },
  setListUnread: function () { setState({ listFilter: 'unread' }); },
  pickDomain: function (el) { setState({ domain: el.getAttribute('data-key') }); },
  actSave: function () { showToast(App.state.lang === 'ar' ? 'تم حفظ الفاتورة' : 'Invoice saved'); },
  actPay: function () { showToast(App.state.lang === 'ar' ? 'جارٍ فتح صفحة الدفع' : 'Opening payment'); },
  actTransfer: function () { showToast(App.state.lang === 'ar' ? 'جارٍ تجهيز التحويل' : 'Preparing transfer'); },
  actSmart: function () { showToast(App.state.lang === 'ar' ? 'البحث الذكي مُفعّل' : 'Smart search on'); },
  actSaveSearch: function () { showToast(App.state.lang === 'ar' ? 'تم حفظ البحث' : 'Search saved'); },
  actForgot: function () { showToast(App.state.lang === 'ar' ? 'أرسلنا رابط استعادة كلمة المرور' : 'Reset link sent'); },
  actSocial: function () { showToast(App.state.lang === 'ar' ? 'جارٍ المتابعة…' : 'Continuing…'); },
  actPersonal: function () { showToast(App.state.lang === 'ar' ? 'البيانات الشخصية' : 'Personal information'); },
  actPrivacy: function () { showToast(App.state.lang === 'ar' ? 'الخصوصية والأمان' : 'Privacy & Security'); }
};

/* Event delegation — one listener, every button works */
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (ACTIONS[act]) {
    e.preventDefault();
    ACTIONS[act](el);
  }
});

/* Keep input values from being wiped on re-render: stop propagation
   so typing does not trigger delegated actions, and let inputs work. */
document.getElementById('app').addEventListener('input', function (e) {
  e.stopPropagation();
});

render();
</script>

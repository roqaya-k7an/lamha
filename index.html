/* --------------------------- Helpers ------------------------------ */
function setState(patch) {
  Object.assign(App.state, patch);
  render();
}
function go(s) { setState({ screen: s, domainsOpen: false, menuOpen: false }); }
function showToast(m) {
  setState({ toast: m });
  clearTimeout(App._tt);
  App._tt = setTimeout(function () { setState({ toast: '' }); }, 1800);
}
function toArabicNum(n) {
  return App.state.lang === 'ar'
    ? ('' + n).replace(/\d/g, function (d) { return '٠١٢٣٤٥٦٧٨٩'[d]; })
    : ('' + n);
}
function softMix(c, p) { return 'color-mix(in srgb, ' + c + ' ' + p + '%, #FFF)'; }
/* Tint that blends into the current surface, so it stays attractive in
   both light and dark mode and shifts with the active palette. */
function tintSurf(c, p) { return 'color-mix(in srgb, ' + c + ' ' + p + '%, var(--surf,#FFF))'; }
function esc(s) { return ('' + s).replace(/"/g, '&quot;'); }

/* The Lamha logo mark (colors driven by CSS vars) */
function logo(size) {
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 96 96" fill="none">'
    + '<rect width="96" height="96" rx="26" fill="var(--pr,#0F7A5A)"></rect>'
    + '<rect x="20" y="26" width="56" height="11" rx="5.5" fill="#FFFFFF"></rect>'
    + '<rect x="34" y="43" width="42" height="11" rx="5.5" fill="var(--ac,#FFB020)"></rect>'
    + '<rect x="52" y="60" width="24" height="11" rx="5.5" fill="var(--mint,#2FD08A)"></rect>'
    + '<circle cx="28" cy="65.5" r="8" fill="var(--ink,#FF4757)"></circle></svg>';
}

/* ---------------------- Computed view model ----------------------- */
function computeVals() {
  var st = App.state;
  var lang = st.lang;
  var t = T[lang];
  var s = st.screen;
  var dom = st.domain;
  var pal = PALETTES.find(function (p) { return p.id === st.palette; }) || PALETTES[0];
  var dark = st.darkMode;
  var dcol = { all:pal.pr, banks:pal.pr, telecom:pal.mint, shop:pal.ac, delivery:pal.pr2, health:pal.ink, travel:pal.mint };
  var visible = NOTIFS.filter(function (n) { return n.domains.indexOf(dom) !== -1; });
  var activeDomain = DOMAINS.find(function (d) { return d.key === dom; }) || DOMAINS[0];
  var isUnread = function (n) { return n.read === false; };
  var prioF = function (a) { return st.priorityOnly ? a.filter(function (n) { return n.bK; }) : a; };
  var shown = prioF(visible);
  var listBase = prioF(visible.filter(function (n) {
    return st.listFilter === 'all' || isUnread(n);
  }));
  var badge = function (k) {
    return k === 'urgent' ? (lang === 'ar' ? 'عاجل' : 'Urgent')
      : k === 'important' ? (lang === 'ar' ? 'مهم' : 'Important')
      : k === 'worth' ? (lang === 'ar' ? 'يستحق انتباهك' : 'Worth a look') : '';
  };
  var mapN = function (n) {
    var key = n.domains[1] || 'all';
    var c = dcol[key] || pal.pr;
    var urgent = n.bK === 'urgent', important = n.bK === 'important', worth = n.bK === 'worth';
    var unread = isUnread(n);
    return {
      id: n.id,
      initial: n[lang === 'ar' ? 'iAr' : 'iEn'],
      avBg: urgent ? pal.ink : important ? pal.pr : worth ? pal.ac : softMix(c, 16),
      avColor: urgent ? '#FFF' : important ? '#FFF' : worth ? '#231708' : c,
      title: n[lang === 'ar' ? 'titleAr' : 'titleEn'],
      sub: n[lang === 'ar' ? 'subAr' : 'subEn'],
      body: n[lang === 'ar' ? 'bodyAr' : 'bodyEn'] || '',
      time: n[lang === 'ar' ? 'tAr' : 'tEn'],
      badge: badge(n.bK),
      badgeBg: urgent ? pal.ink : important ? pal.pr : worth ? pal.ac : 'transparent',
      badgeColor: (urgent || important) ? '#FFF' : '#231708',
      bg: urgent ? tintSurf(pal.ink, 15) : important ? tintSurf(pal.pr, 14) : worth ? tintSurf(pal.ac, 20) : tintSurf(c, 13),
      border: urgent ? tintSurf(pal.ink, 36) : important ? tintSurf(pal.pr, 34) : worth ? tintSurf(pal.ac, 44) : tintSurf(c, 30),
      time2: (n[lang === 'ar' ? 'tAr' : 'tEn']) || t.today,
      unread: unread,
      rail: unread ? pal.pr : c
    };
  };

  // calendar
  var active = 9, dotDay = 18, lead = 1;
  var calDays = [];
  for (var i = 0; i < 35; i++) {
    var num = i - lead + 1;
    if (num < 1 || num > 30) {
      calDays.push({ num: '', bg: 'transparent', color: 'transparent', weight: '400', dot: false });
    } else {
      calDays.push({
        num: toArabicNum(num),
        bg: num === active ? pal.pr : 'transparent',
        color: num === active ? '#FFF' : (dark ? '#EAF3EE' : '#10221B'),
        weight: num === active ? '700' : '400',
        dot: num === dotDay
      });
    }
  }

  var connectedCount = Object.keys(st.connected).filter(function (k) { return st.connected[k]; }).length;

  // ---- Aggregator model: summary, needs-attention, smart groups ----
  var allNotifs = NOTIFS;
  var totalCount = allNotifs.length;
  var importantCount = allNotifs.filter(function (n) { return n.bK === 'urgent' || n.bK === 'important'; }).length;
  var unreadCount = allNotifs.filter(isUnread).length;
  var needsAttention = allNotifs.filter(function (n) {
    return (n.bK === 'urgent' || n.bK === 'important') && isUnread(n);
  });
  var smartGroups = DOMAINS.filter(function (d) { return d.key !== 'all'; }).map(function (d) {
    var c = dcol[d.key] || pal.pr;
    var inGroup = allNotifs.filter(function (n) { return n.domains.indexOf(d.key) !== -1; });
    var unreadInGroup = inGroup.filter(isUnread).length;
    return {
      key: d.key,
      name: lang === 'ar' ? d.groupAr : d.groupEn,
      count: toArabicNum(inGroup.length),
      unread: unreadInGroup,
      unreadLabel: toArabicNum(unreadInGroup),
      last: lang === 'ar' ? d.lastAr : d.lastEn,
      icon: ICON[d.icon], color: c, iconBg: tintSurf(c, 16), ring: tintSurf(c, 30)
    };
  });

  return {
    t: t,
    lang: lang,
    dir: lang === 'ar' ? 'rtl' : 'ltr',
    arrowFlip: lang === 'ar' ? '1' : '-1',
    themeVars: '--pr:' + pal.pr + ';--pr2:' + pal.pr2 + ';--dk:' + pal.dk + ';--ac:' + pal.ac
      + ';--mint:' + pal.mint + ';--ink:' + pal.ink
      + ';--bg:' + (dark ? '#111C17' : '#F4EEE2')
      + ';--surf:' + (dark ? '#1C2E27' : '#FFFFFF')
      + ';--txt:' + (dark ? '#EAF3EE' : '#10221B')
      + ';--head:' + (dark ? '#EAF3EE' : pal.dk)
      + ';--line:' + (dark ? '#2C3E35' : '#EFE8DC')
      + ';--sub:' + (dark ? '#A9BCB2' : '#4A5B52') + ';',
    pal: pal, dcol: dcol,
    cPr: pal.pr, cAc: pal.ac, cMint: pal.mint, cInk: pal.ink, cDk: pal.dk,
    activePaletteName: lang === 'ar' ? pal.ar : pal.en,
    isOnboarding: s === 'onboarding', isHome: s === 'home', isSearch: s === 'search',
    isDetails: s === 'details', isThread: s === 'thread', isSettings: s === 'settings',
    isList: s === 'list', isCalendar: s === 'calendar', isAuth: s === 'auth',
    isPermission: s === 'permission', isConnect: s === 'connect', isLock: s === 'lock',
    showNav: ['home', 'settings', 'thread', 'list', 'search'].indexOf(s) !== -1,
    authIsLogin: st.authMode === 'login', authIsSignup: st.authMode === 'signup',
    authCta: st.authMode === 'login' ? t.authCtaLogin : t.authCtaSignup,
    authLoginBg: st.authMode === 'login' ? '#FFFFFF' : 'transparent',
    authLoginColor: st.authMode === 'login' ? pal.dk : '#8A968F',
    authSignupBg: st.authMode === 'signup' ? '#FFFFFF' : 'transparent',
    authSignupColor: st.authMode === 'signup' ? pal.dk : '#8A968F',
    connectedCount: connectedCount,
    connectedLabel: lang === 'ar'
      ? (toArabicNum(connectedCount) + ' مصادر مفعّلة')
      : (connectedCount + ' sources connected'),
    toast: st.toast,
    menuOpen: st.menuOpen, domainsOpen: st.domainsOpen,
    pushTrack: st.push ? pal.pr : '#C9C1B0', pushAlign: st.push ? 'flex-end' : 'flex-start',
    soundTrack: st.sound ? pal.pr : '#C9C1B0', soundAlign: st.sound ? 'flex-end' : 'flex-start',
    priorityTrack: st.priorityOnly ? pal.pr : '#C9C1B0', priorityAlign: st.priorityOnly ? 'flex-end' : 'flex-start',
    lightBg: !dark ? pal.pr : 'transparent', lightColor: !dark ? '#FFF' : '#8A968F',
    darkBg: dark ? pal.pr : 'transparent', darkColor: dark ? '#FFF' : '#8A968F',
    listAllBg: st.listFilter === 'all' ? pal.pr : '#FFF', listAllColor: st.listFilter === 'all' ? '#FFF' : '#4A5B52', listAllBorder: st.listFilter === 'all' ? pal.pr : '#E4DCCB',
    listUnreadBg: st.listFilter === 'unread' ? pal.pr : '#FFF', listUnreadColor: st.listFilter === 'unread' ? '#FFF' : '#4A5B52', listUnreadBorder: st.listFilter === 'unread' ? pal.pr : '#E4DCCB',
    listEmpty: listBase.length === 0, listHasItems: listBase.length > 0,
    listNotifs: listBase.map(mapN),
    activeDomainLabel: lang === 'ar' ? activeDomain.ar : activeDomain.en,
    activeCount: toArabicNum(activeDomain.count),
    visibleCountLabel: lang === 'ar' ? (toArabicNum(shown.length) + ' إشعار') : (shown.length + ' notifications'),
    visibleNotifs: shown.map(mapN),
    // aggregator home
    sumTotal: toArabicNum(totalCount), sumImportant: toArabicNum(importantCount), sumUnread: toArabicNum(unreadCount),
    needsList: needsAttention.map(mapN), needsCount: toArabicNum(needsAttention.length), hasNeeds: needsAttention.length > 0,
    smartGroups: smartGroups,
    // related notifications (details): same domain as the deposit sample (banks), excluding itself
    related: NOTIFS.filter(function (n) { return n.domains.indexOf('banks') !== -1 && n.id !== 'deposit'; }).slice(0, 3).map(mapN),
    navHomeColor: s === 'home' ? pal.pr : '#9AA69F',
    navListColor: s === 'list' ? pal.pr : '#9AA69F',
    navSearchColor: s === 'search' ? pal.pr : '#9AA69F',
    navMoreColor: (s === 'settings' || s === 'thread') ? pal.pr : '#9AA69F',
    tabIsThread: st.tab === 'thread', tabIsHistory: st.tab === 'history',
    threadTabBg: st.tab === 'thread' ? '#FFFFFF' : 'transparent', threadTabColor: st.tab === 'thread' ? pal.dk : '#8A968F',
    historyTabBg: st.tab === 'history' ? '#FFFFFF' : 'transparent', historyTabColor: st.tab === 'history' ? pal.dk : '#8A968F',
    weekdays: t.weekdays, calDays: calDays,
    sources: DOMAINS.filter(function (d) { return d.key !== 'all'; }).map(function (d) {
      var on = st.connected[d.key];
      var c = dcol[d.key] || pal.pr;
      return {
        key: d.key,
        label: lang === 'ar' ? d.ar : d.en,
        sub: lang === 'ar' ? (toArabicNum(d.count) + ' إشعار حتى الآن') : (d.count + ' alerts so far'),
        icon: ICON[d.icon], iconBg: softMix(c, 15), iconColor: c,
        track: on ? pal.pr : '#C9C1B0', align: on ? 'flex-end' : 'flex-start'
      };
    }),
    palettes: PALETTES.map(function (p) {
      return {
        id: p.id, name: lang === 'ar' ? p.ar : p.en,
        c0: p.sw[0], c1: p.sw[1], c2: p.sw[2], c3: p.sw[3], c4: p.sw[4],
        ring: p.id === st.palette ? p.pr : '#EDE6D9',
        labelColor: p.id === st.palette ? p.pr : '#4A5B52'
      };
    }),
    domains: DOMAINS.map(function (d) {
      var on = d.key === dom;
      var c = dcol[d.key] || pal.pr;
      return {
        key: d.key, label: lang === 'ar' ? d.ar : d.en, count: toArabicNum(d.count),
        icon: ICON[d.icon],
        bg: on ? pal.dk : softMix(c, 15),
        iconColor: on ? '#FFF' : c,
        labelColor: on ? '#FFF' : 'var(--txt,#10221B)',
        countColor: on ? 'rgba(255,255,255,.75)' : c
      };
    })
  };

/* Current visible screen inside the phone */
function activeScreen(v) {
  if (v.isOnboarding) return screenOnboarding(v);
  if (v.isAuth) return screenAuth(v);
  if (v.isPermission) return screenPermission(v);
  if (v.isConnect) return screenConnect(v);
  if (v.isLock) return screenLock(v);
  if (v.isHome) return screenHome(v);
  if (v.isSearch) return screenSearch(v);
  if (v.isDetails) return screenDetails(v);
  if (v.isThread) return screenThread(v);
  if (v.isSettings) return screenSettings(v);
  if (v.isList) return screenList(v);
  if (v.isCalendar) return screenCalendar(v);
  return '';
}

  var html = ''
    + '<div dir="' + v.dir + '" style="font-family:\'Readex Pro\',\'IBM Plex Sans Arabic\',system-ui,sans-serif; color:var(--txt,#10221B); min-height:100vh; background:radial-gradient(circle at 50% 0,#EEE8DC,#E1DACC); display:flex; flex-direction:column; align-items:center; gap:18px; padding:34px 20px;">'
    + '<div style="display:flex; align-items:center; gap:10px;">'

    + '<span style="font-family:\'Readex Pro\'; font-weight:700; font-size:19px; color:' + v.cDk + ';">' + v.t.previewTitle + '</span>'
    + '</div>'
    + paletteSwitcher(v)
    + '<div style="width:340px; height:700px; background:#0B1712; border-radius:46px; padding:11px; box-shadow:0 40px 90px -30px rgba(11,23,18,.6); position:relative;">'
    + '<div style="position:absolute; top:22px; left:50%; transform:translateX(-50%); width:110px; height:26px; background:#0B1712; border-radius:0 0 16px 16px; z-index:60;"></div>'
    + '<div class="lm-scroll" style="' + v.themeVars + ' width:100%; height:100%; background:var(--bg,#F4EEE2); border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column;">'
    + '<div style="height:44px; display:flex; align-items:center; justify-content:space-between; padding:0 26px; font-size:13px; font-weight:600; color:var(--txt,#10221B); flex-shrink:0; z-index:20;"><span>9:41</span><span style="letter-spacing:1px;">▪▪▪ ▪ ▮</span></div>'
    + '<div style="flex:1; position:relative; overflow:hidden;">' + activeScreen(v) + '</div>'
    + overlays
    + nav
    + '</div></div></div>';

  document.getElementById('app').innerHTML = html;
}

/* --------------------------- Actions ------------------------------ */
var ACTIONS = {
  toggleLang: function () { setState({ lang: App.state.lang === 'ar' ? 'en' : 'ar' }); },
  pickPalette: function (el) { setState({ palette: el.getAttribute('data-id') }); },
  goSignup: function () { setState({ screen: 'auth', authMode: 'signup', domainsOpen: false, menuOpen: false }); },
  goLogin: function () { setState({ screen: 'auth', authMode: 'login', domainsOpen: false, menuOpen: false }); },
  goOnboarding: function () { go('onboarding'); },
  setAuthLogin: function () { setState({ authMode: 'login' }); },
  setAuthSignup: function () { setState({ authMode: 'signup' }); },
  submitAuth: function () { go('permission'); },
  allowPerm: function () { go('connect'); },
  laterPerm: function () { go('connect'); },
  toggleSource: function (el) {
    var k = el.getAttribute('data-key');
    var c = Object.assign({}, App.state.connected);
    c[k] = !c[k];
    setState({ connected: c });
  },
  connectContinue: function () { go('lock'); },
  openApp: function () { go('home'); },
  openDetails: function () { setState({ screen: 'details', domainsOpen: false, menuOpen: false }); },
  openNotif: function () { setState({ screen: 'details', domainsOpen: false, menuOpen: false }); },
  openGroup: function (el) { setState({ domain: el.getAttribute('data-key'), screen: 'list', listFilter: 'all', domainsOpen: false, menuOpen: false }); },
  goHome: function () { go('home'); },
  goSearch: function () { go('search'); },
  goSettings: function () { go('settings'); },
  goList: function () { go('list'); },
  goCalendar: function () { go('calendar'); },
  goThread: function () { setState({ screen: 'thread', domainsOpen: false, menuOpen: false, tab: 'thread' }); },
  openMenu: function () { setState({ menuOpen: true }); },
  closeMenu: function () { setState({ menuOpen: false }); },
  openDomains: function () { setState({ domainsOpen: true }); },
  closeDomains: function () { setState({ domainsOpen: false }); },
  setTabThread: function () { setState({ tab: 'thread' }); },
  setTabHistory: function () { setState({ tab: 'history' }); },
  togglePush: function () { setState({ push: !App.state.push }); },
  toggleSound: function () { setState({ sound: !App.state.sound }); },
  togglePriority: function () { setState({ priorityOnly: !App.state.priorityOnly }); },
  setLight: function () { setState({ darkMode: false }); },
  setDark: function () { setState({ darkMode: true }); },
  setListAll: function () { setState({ listFilter: 'all' }); },
  setListUnread: function () { setState({ listFilter: 'unread' }); },
  pickDomain: function (el) { setState({ domain: el.getAttribute('data-key') }); },
  // aggregator actions (Lamha organizes/retrieves — it does not transact)
  actMarkRead: function () { showToast(App.state.lang === 'ar' ? 'تم التمييز كمقروء' : 'Marked as read'); },
  actPin: function () { showToast(App.state.lang === 'ar' ? 'تم تثبيت الإشعار' : 'Notification pinned'); },
  actMute: function () { showToast(App.state.lang === 'ar' ? 'تم كتم هذا المرسِل' : 'Sender muted'); },
  actShare: function () { showToast(App.state.lang === 'ar' ? 'مشاركة الملخص…' : 'Sharing summary…'); },
  actOpenSrc: function () { showToast(App.state.lang === 'ar' ? 'فتح في تطبيق المرسِل…' : 'Opening in source app…'); },
  // smart search
  setScope: function (el) { setState({ searchScope: el.getAttribute('data-scope') }); },
  applySuggestion: function (el) {
    var q = el.getAttribute('data-q');
    var rec = (App.state.recentSearches || []).filter(function (x) { return x !== q; });
    rec.unshift(q); rec = rec.slice(0, 5);
    setState({ searchQuery: q, searchScope: 'all', recentSearches: rec });
  },
  clearQuery: function () { setState({ searchQuery: '' }); },
  clearRecent: function () { setState({ recentSearches: [] }); },
  actSmart: function () { showToast(App.state.lang === 'ar' ? 'البحث الذكي مُفعّل' : 'Smart search on'); },
  actSaveSearch: function () { showToast(App.state.lang === 'ar' ? 'تم حفظ البحث' : 'Search saved'); },
  actForgot: function () { showToast(App.state.lang === 'ar' ? 'أرسلنا رابط استعادة كلمة المرور' : 'Reset link sent'); },
  actSocial: function () { showToast(App.state.lang === 'ar' ? 'جارٍ المتابعة…' : 'Continuing…'); },
  actPersonal: function () { showToast(App.state.lang === 'ar' ? 'البيانات الشخصية' : 'Personal information'); },
  actPrivacy: function () { showToast(App.state.lang === 'ar' ? 'الخصوصية والأمان' : 'Privacy & Security'); }
};

/* Event delegation — one listener, every button works */
document.getElementById('app').addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  if (ACTIONS[act]) {
    e.preventDefault();
    ACTIONS[act](el);
  }
});

/* Keep input values from being wiped on re-render: stop propagation
   so typing does not trigger delegated actions, and let inputs work. */
document.getElementById('app').addEventListener('input', function (e) {
  var el = e.target;
  // Live smart search: update results in place, keep input focused (no full re-render)
  if (el && el.getAttribute && el.getAttribute('data-search') !== null) {
    App.state.searchQuery = el.value;
    var box = document.getElementById('lm-results');
    if (box) box.innerHTML = searchResultsHTML(el.value, App.state.searchScope);
  }
  e.stopPropagation();
});

render();
</script>
